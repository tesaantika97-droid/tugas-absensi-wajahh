<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Wajah - Clean Elegant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'beige-bg': '#F9F6F0',      // Latar belakang utama (Beige Lembut)
                        'beige-card': '#F1EAE0',    // Latar belakang elemen/card
                        'brown-text': '#4A3525',    // Warna teks utama (Cokelat Tua)
                        'brown-sub': '#8C7662',     // Warna teks sekunder (Cokelat Muda)
                        'elegant-yellow': '#F4C430',// Warna Aksen (Kuning Emas)
                        'elegant-hover': '#E0B226'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar untuk log */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #F1EAE0; }
        ::-webkit-scrollbar-thumb { background: #8C7662; border-radius: 10px; }
    </style>
</head>
<body class="bg-beige-bg text-brown-text min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-white border-b border-beige-card px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-brown-text flex items-center justify-center text-elegant-yellow text-lg shadow-sm">
                <i class="fa-solid fa-camera"></i>
            </div>
            <div>
                <span class="text-lg font-bold tracking-tight text-brown-text">AMURA<span class="text-elegant-yellow">PRESENSI</span></span>
                <p class="text-[10px] text-brown-sub font-medium uppercase tracking-wider">Sistem Absen Wajah Instan</p>
            </div>
        </div>
        <div class="text-xs font-semibold text-brown-text bg-beige-card px-3 py-1.5 rounded-lg" id="live-clock">
            Memuat Waktu...
        </div>
    </header>

    <!-- UTAMA (MAIN CONTAINER) -->
    <main class="flex-grow p-4 md:p-8 max-w-4xl mx-auto w-full flex flex-col gap-6">
        
        <!-- AREA KAMERA / SCANNER -->
        <div class="bg-white p-5 rounded-2xl border border-beige-card shadow-md flex flex-col items-center relative">
            
            <div class="w-full flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-brown-text">Pemindai Aktif</h2>
                </div>
                <span class="text-xs text-brown-sub bg-beige-bg px-2.5 py-1 rounded-full border border-beige-card">Kamera Depan</span>
            </div>

            <!-- Frame Kamera -->
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-beige-card flex items-center justify-center shadow-inner">
                <video id="video" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                
                <!-- Kotak Target Pemindai Wajah Elegan -->
                <div id="scanner-box" class="absolute w-52 h-52 border-2 border-elegant-yellow rounded-2xl opacity-40 pointer-events-none transition-all duration-300">
                    <div class="absolute inset-0 bg-elegant-yellow/5"></div>
                    <!-- Sudut Siku Siku Scanner -->
                    <div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-white"></div>
                    <div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-white"></div>
                    <div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-white"></div>
                    <div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-white"></div>
                </div>
            </div>

            <!-- Input Nama Langsung (Biar Ga Perlu Daftar Anggota Dulu) -->
            <div class="w-full mt-4">
                <label class="block text-xs font-bold text-brown-sub uppercase tracking-wider mb-1.5">Nama Pengguna / Karyawan</label>
                <input type="text" id="user-input-name" class="w-full bg-beige-bg border border-beige-card rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-elegant-yellow text-brown-text font-medium placeholder:text-brown-sub/40" placeholder="Ketik nama Anda sebelum melakukan scan...">
            </div>

            <!-- Tombol Scan -->
            <button id="btn-scan" class="mt-4 w-full bg-elegant-yellow hover:bg-elegant-hover text-brown-text font-bold py-3 px-6 rounded-xl transition duration-200 shadow-md tracking-wider text-sm">
                KONFIRMASI & ABSEN SEKARANG
            </button>
        </div>

        <!-- PANEL RIWAYAT / LOG ABSENSI -->
        <div class="bg-white p-5 rounded-2xl border border-beige-card shadow-md flex-grow">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-beige-card">
                <h3 class="text-xs font-bold tracking-widest text-brown-sub uppercase"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Riwayat Kehadiran Terbaru</h3>
                <span id="log-count" class="text-[10px] bg-beige-card text-brown-text font-bold px-2 py-0.5 rounded-full">0 Absen</span>
            </div>
            
            <!-- Daftar Riwayat -->
            <div class="space-y-2.5 max-h-64 overflow-y-auto pr-1" id="log-container">
                <!-- Tampilan kosong default -->
                <div id="empty-state" class="text-center py-8 text-brown-sub">
                    <i class="fa-solid fa-user-ninja text-2xl mb-2 opacity-30"></i>
                    <p class="text-xs">Belum ada riwayat presensi hari ini.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-xs text-brown-sub border-t border-beige-card bg-white">
        &copy; 2026 <span class="text-brown-text font-semibold">AmuraPresensi</span> — Sistem Minimalis Modern.
    </footer>

    <!-- Logic Script -->
    <script src="app.js"></script>
</body>
</html>
